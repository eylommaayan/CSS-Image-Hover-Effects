<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מדריך מלא: 24 אפקטי Image Hover ב-CSS</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lato:400,700"
    />
    <style>
      /* ===================================================
       1. איפוס וסגנון גלובלי
       =================================================== */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Lato",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background-color: #1e272e;
        color: #ffffff;
        padding: 30px 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        font-size: 32px;
        margin-bottom: 8px;
        color: #f1f2f6;
        text-align: center;
      }

      .main-subtitle {
        color: #a4b0be;
        margin-bottom: 30px;
        font-size: 16px;
        text-align: center;
      }

      /* רשת כפתורי הניווט */
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
        width: 100%;
        max-width: 1100px;
        margin-bottom: 35px;
      }

      .menu-btn {
        background: #2f3542;
        border: 1px solid #57606f;
        color: #f1f2f6;
        padding: 10px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
        transition: all 0.2s ease;
        text-align: center;
      }

      .menu-btn:hover {
        background: #70a1ff;
        color: #1e272e;
        border-color: #70a1ff;
      }

      .menu-btn.active {
        background: #ff4757;
        color: #ffffff;
        border-color: #ff4757;
      }

      /* אזור התצוגה וההסבר */
      .viewer {
        background: #2f3542;
        border-radius: 14px;
        padding: 30px;
        max-width: 900px;
        width: 100%;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .lesson-header {
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border-right: 5px solid #ff4757;
        padding: 16px 20px;
        margin-bottom: 30px;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .lesson-title {
        font-size: 20px;
        color: #ff6b81;
        font-weight: bold;
      }

      .css-badge {
        background: #1e272e;
        color: #7bed9f;
        padding: 5px 12px;
        border-radius: 6px;
        font-family: Consolas, monospace;
        font-size: 13px;
        direction: ltr;
        border: 1px solid #2ed573;
      }

      .lesson-desc {
        font-size: 14.5px;
        color: #ced6e0;
        line-height: 1.5;
      }

      /* בימת ההדגמה החיה */
      .stage {
        min-height: 360px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ===================================================
       2. מבנה בסיס לכרטיסי ה-Hover
       =================================================== */
      .hover-box {
        width: 480px;
        height: 310px;
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        background-color: #000;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        cursor: pointer;
      }

      .hover-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: all 0.5s ease;
      }

      .hover-caption {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        padding: 25px;
        box-sizing: border-box;
        transition: all 0.5s ease;
        z-index: 3;
      }

      .hover-caption h2 {
        text-transform: uppercase;
        font-size: 22px;
        margin-bottom: 8px;
        letter-spacing: 1px;
      }

      .hover-caption p {
        font-size: 14.5px;
        line-height: 1.4;
        max-width: 85%;
        color: #f1f2f6;
      }

      .hover-btn {
        margin-top: 15px;
        padding: 8px 18px;
        background: #000000;
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        font-size: 12px;
        text-transform: uppercase;
        border-radius: 4px;
        transition: all 0.3s;
      }

      /* ===================================================
       3. הגדרות CSS לכל 24 האפקטים
       =================================================== */

      /* 1. זום וסיבוב עם כותרת שקופה[cite: 28] */
      .fx-1 .hover-caption {
        opacity: 0;
        background: rgba(0, 0, 0, 0.5);
      }
      .fx-1:hover img {
        transform: scale(1.3) rotate(15deg);
      }
      .fx-1:hover .hover-caption {
        opacity: 1;
      }

      /* 2. כותרת יורדת מלמעלה ותמונה מסתובבת הפוך[cite: 28] */
      .fx-2 .hover-caption {
        transform: translateY(-100%);
        background: rgba(0, 0, 0, 0.5);
      }
      .fx-2:hover img {
        transform: scale(1.3) rotate(-15deg);
      }
      .fx-2:hover .hover-caption {
        transform: translateY(0);
      }

      /* 3. החלפת מקומות אנכית[cite: 28] */
      .fx-3 .hover-caption {
        background: #000;
        transform: translateY(-100%);
      }
      .fx-3:hover img {
        transform: translateY(100%);
      }
      .fx-3:hover .hover-caption {
        transform: translateY(0);
      }

      /* 4. פס תחתון (30%) שמתרומם למעלה[cite: 28] */
      .fx-4 .hover-caption {
        top: auto;
        bottom: 0;
        height: 30%;
        background: #000;
        transform: translateY(100%);
      }
      .fx-4:hover img {
        transform: translateY(-20%);
      }
      .fx-4:hover .hover-caption {
        transform: translateY(0);
      }

      /* 5. שכבה צבעונית מסתובבת ב-45 מעלות[cite: 28] */
      .fx-5 .overlay-rotate {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #006266;
        opacity: 0.7;
        transform: translateY(100%);
        transition: all 0.4s ease;
      }
      .fx-5 .hover-caption {
        transform: translateY(-20px);
        opacity: 0;
      }
      .fx-5:hover .overlay-rotate {
        transform: translateY(0) rotate(45deg) scale(2.2);
      }
      .fx-5:hover .hover-caption {
        transform: translateY(0);
        opacity: 1;
        transition-delay: 0.15s;
      }

      /* 6. מסגרת לבנה עבה וזום עם סיבוב קל[cite: 28] */
      .fx-6 {
        border: 10px solid #ffffff;
      }
      .fx-6:hover img {
        transform: scale(1.2) rotate(9deg);
      }

      /* 7. כניסה מדורגת של טקסטים מכיוונים נגדיים[cite: 28] */
      .fx-7 .bg-bar {
        position: absolute;
        width: 120%;
        height: 210%;
        background: #2d3436;
        opacity: 0.85;
        transform: translate(550px, 300px) rotate(45deg);
        transition: all 0.5s ease;
      }
      .fx-7 h2 {
        transform: translateY(200px);
        transition: 0.3s;
        opacity: 0;
      }
      .fx-7 p {
        transform: translateY(-200px);
        transition: 0.4s;
        opacity: 0;
      }
      .fx-7 a {
        transform: translateY(100px);
        transition: 0.5s;
        opacity: 0;
      }
      .fx-7:hover .bg-bar {
        transform: translate(-50px, -150px) rotate(45deg);
      }
      .fx-7:hover h2,
      .fx-7:hover p,
      .fx-7:hover a {
        transform: translateY(0);
        opacity: 1;
      }

      /* 8. שילוב סיבובים וכניסות אלכסוניות[cite: 28] */
      .fx-8 .bg-bar {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #2d3436;
        opacity: 0.85;
        transform: translate(650px, -100px) rotate(180deg);
        transition: all 0.35s ease;
      }
      .fx-8 h2 {
        transform: translateY(-150px);
        transition: 0.3s;
      }
      .fx-8 p {
        transform: translateY(300px) rotate(90deg);
        transition: 0.4s;
      }
      .fx-8 a {
        transform: translateY(0);
        opacity: 0;
        transition: 0.3s;
      }
      .fx-8:hover .bg-bar {
        transform: translate(0, 0) rotate(0deg);
      }
      .fx-8:hover h2 {
        transform: translateY(0);
      }
      .fx-8:hover p {
        transform: translateY(0) rotate(0deg);
      }
      .fx-8:hover a {
        opacity: 1;
      }

      /* 9. כיווץ התמונה ל-0 והחלפתה בשכבה מסתובבת[cite: 28] */
      .fx-9 .bg-bar {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #2d3436;
        opacity: 0.85;
        transform: scale(0) rotate(-180deg);
        transition: all 0.5s ease;
      }
      .fx-9 h2,
      .fx-9 p,
      .fx-9 a {
        opacity: 0;
        transition: 0.4s;
      }
      .fx-9:hover img {
        transform: scale(0);
        opacity: 0;
      }
      .fx-9:hover .bg-bar {
        transform: scale(1) rotate(0deg);
      }
      .fx-9:hover h2,
      .fx-9:hover p,
      .fx-9:hover a {
        opacity: 1;
        transition-delay: 0.25s;
      }

      /* 10. טקסטים שמגיעים ממרחק עצום (scale: 10)[cite: 28] */
      .fx-10 .bg-bar {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #006266;
        opacity: 0;
        transition: all 0.3s ease;
      }
      .fx-10 h2,
      .fx-10 p {
        transform: scale(10);
        opacity: 0;
        transition: all 0.35s;
      }
      .fx-10 a {
        transform: translateY(150px);
        opacity: 0;
        transition: 0.25s;
      }
      .fx-10:hover .bg-bar {
        opacity: 0.9;
      }
      .fx-10:hover h2,
      .fx-10:hover p {
        transform: scale(1);
        opacity: 1;
      }
      .fx-10:hover a {
        transform: translateY(0);
        opacity: 1;
        transition-delay: 0.2s;
      }

      /* 11. תמונה מסתובבת ב-720 מעלות ונעלמת[cite: 28] */
      .fx-11 .bg-bar {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #2d3436;
        opacity: 0;
        transition: all 0.4s ease;
      }
      .fx-11 h2 {
        transform: translateY(-300px);
        transition: 0.3s;
      }
      .fx-11 p {
        transform: translateY(-30px);
        opacity: 0;
        transition: 0.3s;
      }
      .fx-11 a {
        transform: translateY(150px);
        transition: 0.3s;
      }
      .fx-11:hover img {
        transform: rotate(720deg) scale(0);
        opacity: 0;
      }
      .fx-11:hover .bg-bar {
        opacity: 0.95;
      }
      .fx-11:hover h2,
      .fx-11:hover p,
      .fx-11:hover a {
        transform: translateY(0);
        opacity: 1;
      }

      /* 12. צמצם מעגלי מתרחב */
      .fx-12 .hover-caption {
        background: #0984e3;
        clip-path: circle(0% at 50% 50%);
        transition: clip-path 0.5s ease-in-out;
      }
      .fx-12:hover .hover-caption {
        clip-path: circle(75% at 50% 50%);
      }

      /* 13. זכוכית מטושטשת (Frosted Glass) */
      .fx-13 .hover-caption {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(0px);
        opacity: 0;
        transition: all 0.4s ease;
      }
      .fx-13:hover img {
        filter: blur(5px) grayscale(40%);
      }
      .fx-13:hover .hover-caption {
        backdrop-filter: blur(8px);
        opacity: 1;
      }

      /* 14. וילונות אלכסוניים (Diagonal Slices) */
      .fx-14 .hover-caption {
        background: #d63031;
        clip-path: polygon(0 0, 0 0, 0 100%, 0% 100%);
        transition: clip-path 0.5s ease-in-out;
      }
      .fx-14:hover .hover-caption {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }

      /* 15. כרטיס תלת-ממדי מרחף (Card Pop & Glow) */
      .fx-15 {
        transition:
          transform 0.4s ease,
          box-shadow 0.4s ease;
      }
      .fx-15 .hover-caption {
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
        opacity: 0;
        transform: translateY(20px);
      }
      .fx-15:hover {
        transform: translateY(-12px) scale(1.02);
        box-shadow: 0 20px 35px rgba(112, 161, 255, 0.4);
      }
      .fx-15:hover .hover-caption {
        opacity: 1;
        transform: translateY(0);
      }

      /* 16. זום פנורמי איטי (Ken Burns Effect) */
      .fx-16 img {
        transform-origin: center center;
        transition: transform 5s ease-out;
      }
      .fx-16 .hover-caption {
        background: rgba(0, 0, 0, 0.4);
        opacity: 0;
      }
      .fx-16:hover img {
        transform: scale(1.35) translate(-15px, -10px);
      }
      .fx-16:hover .hover-caption {
        opacity: 1;
      }

      /* 17. מסך מפוצל שנפתח (Curtain Split) */
      .fx-17::before,
      .fx-17::after {
        content: "";
        position: absolute;
        top: 0;
        width: 50%;
        height: 100%;
        background: #1e272e;
        transition: transform 0.5s ease-in-out;
        z-index: 2;
      }
      .fx-17::before {
        left: 0;
      }
      .fx-17::after {
        right: 0;
      }
      .fx-17:hover::before {
        transform: translateX(-100%);
      }
      .fx-17:hover::after {
        transform: translateX(100%);
      }

      /* 18. הפיכה משחור-לבן לצבע מלא (Grayscale to Color) */
      .fx-18 img {
        filter: grayscale(100%) contrast(120%);
        transition: filter 0.6s ease;
      }
      .fx-18:hover img {
        filter: grayscale(0%) contrast(100%);
      }

      /* 19. קרן אור אלכסונית חולפת (Light Sweep / Flash) */
      .fx-19::after {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.5),
          transparent
        );
        transform: skewX(-25deg);
        transition: left 0.75s ease;
        z-index: 2;
      }
      .fx-19:hover::after {
        left: 160%;
      }

      /* 20. חלון זרקור עגול (Spotlight Mask) */
      .fx-20 img {
        filter: brightness(0.25);
        transition: filter 0.5s ease;
      }
      .fx-20:hover img {
        filter: brightness(1);
      }

      /* 21. היפוך מראה אופקי (Horizontal Mirror Flip) */
      .fx-21:hover img {
        transform: scaleX(-1);
      }

      /* 22. גליץ' צבעים דיגיטלי (RGB Glitch Shift) */
      .fx-22:hover img {
        filter: drop-shadow(4px 0px 0px red) drop-shadow(-4px 0px 0px cyan);
        transform: translate(-2px, 2px);
      }

      /* 23. מסגרת פנימית מתרחבת (Border Outline Inset) */
      .fx-23::before {
        content: "";
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        bottom: 15px;
        border: 2px solid white;
        transform: scale(0);
        opacity: 0;
        transition: all 0.4s ease;
        z-index: 2;
      }
      .fx-23:hover::before {
        transform: scale(1);
        opacity: 1;
      }

      /* 24. אפקט צבע עמוק (Sepia to Vibrant Saturation) */
      .fx-24 img {
        filter: sepia(80%) hue-rotate(180deg);
        transition: filter 0.6s ease;
      }
      .fx-24:hover img {
        filter: sepia(0%) saturate(140%);
      }
    </style>
  </head>
  <body>
    <h1>מדריך מלא: 24 אפקטי Image Hover ב-CSS</h1>
    <p class="main-subtitle">
      בחר אפקט כדי לראות את ההדגמה החיה, את ההסבר ואת פקודת ה-CSS המרכזית שמבצעת
      אותו:
    </p>

    <!-- רשת כפתורים -->
    <div class="menu-grid" id="menuGrid"></div>

    <!-- מסך התצוגה המרכזי -->
    <div class="viewer">
      <div class="lesson-header">
        <div class="title-row">
          <span class="lesson-title" id="effectTitle"></span>
          <span class="css-badge" id="cssBadge"></span>
        </div>
        <p class="lesson-desc" id="effectDesc"></p>
      </div>

      <div class="stage" id="stageArea"></div>
    </div>

    <script>
      // מאגר 24 האפקטים המלא
      const effectsData = [
        {
          id: "fx-1",
          title: "אפקט 1: זום וסיבוב עם כותרת שקופה",
          cmd: "transform: scale(1.3) rotate(15deg);",
          desc: "התמונה גדלה ב-30% ומסתובבת ב-15 מעלות, בעוד שכבת הכיתוב עוברת מ-opacity: 0 ל-1[cite: 28].",
          html: `
          <div class="hover-box fx-1">
            <img src="https://picsum.photos/id/1015/600/400" alt="Demo">
            <div class="hover-caption">
              <h2>Amazing Caption</h2>
              <p>You can write anything here</p>
            </div>
          </div>
        `,
        },
        {
          id: "fx-2",
          title: "אפקט 2: כותרת נכנסת מלמעלה ותמונה מסתובבת הפוך",
          cmd: "transform: translateY(-100%) -> translateY(0);",
          desc: "הכיתוב מחליק מ-translateY(-100%) למקומו, והתמונה מסתובבת במינוס 15 מעלות[cite: 28].",
          html: `
          <div class="hover-box fx-2">
            <img src="https://picsum.photos/id/1018/600/400" alt="Demo">
            <div class="hover-caption">
              <h2>Amazing Caption</h2>
              <p>You can write anything here</p>
            </div>
          </div>
        `,
        },
        {
          id: "fx-3",
          title: "אפקט 3: החלפת מקומות אנכית (Push Down)",
          cmd: "img: translateY(100%); caption: translateY(0);",
          desc: "התמונה נדחפת ב-translateY(100%) כלפי מטה והשכבה השחורה תופסת את מקומה[cite: 28].",
          html: `
          <div class="hover-box fx-3">
            <img src="https://picsum.photos/id/1016/600/400" alt="Demo">
            <div class="hover-caption">
              <h2>Amazing Caption</h2>
              <p>You can write anything here</p>
            </div>
          </div>
        `,
        },
        {
          id: "fx-4",
          title: "אפקט 4: פס תחתון (30%) שמתרומם למעלה",
          cmd: "height: 30%; transform: translateY(100%) -> (0);",
          desc: "הכיתוב תופס רק 30% גובה בחלק התחתון ומתרומם למעלה בעוד התמונה זזה מעט[cite: 28].",
          html: `
          <div class="hover-box fx-4">
            <img src="https://picsum.photos/id/1025/600/400" alt="Demo">
            <div class="hover-caption">
              <h2>Amazing Caption</h2>
              <p>פס כיתוב קומפקטי תחתון</p>
            </div>
          </div>
        `,
        },
        {
          id: "fx-5",
          title: "אפקט 5: שכבה צבעונית מסתובבת ב-45 מעלות",
          cmd: "transform: translateY(0) rotate(45deg) scale(2.2);",
          desc: "שכבת רקע צבעונית נכנסת מלמטה ומסתובבת ב-45 מעלות כדי לכסות את השטח[cite: 28].",
          html: `
          <div class="hover-box fx-5">
            <img src="https://picsum.photos/id/1035/600/400" alt="Demo">
            <div class="overlay-rotate"></div>
            <div class="hover-caption">
              <h2>Creative Title</h2>
              <p>שכבה מלוכסנת שנכנסת ומסתובבת</p>
            </div>
          </div>
        `,
        },
        {
          id: "fx-6",
          title: "אפקט 6: מסגרת לבנה עבה וזום עם סיבוב קל",
          cmd: "border: 10px solid white; transform: scale(1.2) rotate(9deg);",
          desc: "מסגרת לבנה מוצקה ברוחב 10px והתמונה מבצעת זום וסיבוב פנימי קל[cite: 28].",
          html: `
          <div class="hover-box fx-6">
            <img src="https://picsum.photos/id/1039/600/400" alt="Demo">
          </div>
        `,
        },
        {
          id: "fx-7",
